<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0b">
<title>Your pass — NOTJUST</title>
<link rel="icon" type="image/png" href="../assets/notjust-favicon-32x32.png">
<link rel="apple-touch-icon" href="../assets/notjust-apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b0b;--ink:#f3ede2;--soft:#c9c3b8;--muted:#8f8a82;--line:#2a2826;--red:#d62a1e}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(36px + env(safe-area-inset-bottom))}
  .shot{padding:14px;margin:-14px;background:var(--bg);width:calc(100% + 28px);max-width:388px}
  .pass{width:100%;border-radius:22px;overflow:hidden;position:relative;
    background:radial-gradient(120% 70% at 85% 0%,rgba(214,42,30,.28),transparent 60%),linear-gradient(180deg,#1a1817,#121110);
    border:1px solid #2f2c2a;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .top{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 0}
  .top img{width:104px;height:auto;display:block}
  .tag{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);border:1px solid rgba(243,237,226,.35);border-radius:999px;padding:6px 10px}
  .hero{padding:34px 22px 26px}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .status{font-family:"Instrument Serif",serif;font-size:58px;line-height:.92;margin-top:10px}
  .status em{color:var(--red)}
  .name{margin-top:18px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .name b{display:block;margin-top:6px;font-size:24px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
  .cut{position:relative;height:0;border-top:1.5px dashed #3a3633;margin:0 18px}
  .cut::before,.cut::after{content:"";position:absolute;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid #2f2c2a}
  .cut::before{left:-32px}.cut::after{right:-32px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;padding:24px 22px 8px}
  .f span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .f b{font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .f.wide{grid-column:1 / 3}
  .f.wide b{font-size:19px}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px 22px;margin-top:10px;border-top:1px solid var(--line)}
  .foot p{font-size:12px;color:var(--soft);line-height:1.45;max-width:24ch}
  .foot .star{width:34px;height:34px;flex:none}
  .actions{width:100%;max-width:360px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .btn{border:0;font:inherit;cursor:pointer;border-radius:999px;padding:14px 10px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
  .btn.solid{background:var(--ink);color:#0b0b0b}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.5}
  .note{max-width:320px;text-align:center;font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
  .missing{max-width:320px;text-align:center;margin-top:30vh;color:var(--soft)}
  footer{margin-top:auto;padding-top:34px;font-family:"Instrument Serif",serif;font-style:italic;color:var(--muted);font-size:16px}
  footer span{color:var(--red);font-style:normal}
  .bad .shot,.bad .actions,.bad .note{display:none}
  body:not(.bad) .missing{display:none}
</style>
</head>
<body>
  <div class="shot" id="shot">
    <div class="pass">
      <div class="top">
        <img src="../assets/email/notjust-logo-white.png" alt="NOTJUST">
        <span class="tag">Guest list</span>
      </div>
      <div class="hero">
        <div class="kicker" translate="no">Guest of NOTJUST</div>
        <div class="status notranslate" translate="no">You're on<br><em>the list.</em></div>
        <div class="name">Guest<b id="p-name" translate="no"></b></div>
      </div>
      <div class="cut"></div>
      <div class="fields">
        <div class="f wide"><span>Night</span><b id="p-night" translate="no"></b></div>
        <div class="f"><span>Date</span><b id="p-date"></b></div>
        <div class="f"><span>Venue</span><b id="p-venue" translate="no"></b></div>
        <div class="f"><span>City</span><b id="p-city"></b></div>
        <div class="f"><span>Entry</span><b>Name + ID</b></div>
      </div>
      <div class="foot">
        <p>Show this at the door with your ID. See you inside.</p>
        <img class="star" src="../assets/email/notjust-star-white.png" alt="">
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="btn solid" id="save" type="button">Save pass</button>
    <button class="btn ghost" id="cal" type="button">Add to calendar</button>
  </div>
  <p class="note">Tip: save it now. Signal at the door can be bad.</p>
  <p class="missing">This pass link is incomplete. Open it again from your confirmation email.</p>
  <footer translate="no">it was never <span>just</span> music</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* The pass details travel inside the link (after #), written by the confirmation email.
   Nothing is looked up or stored anywhere: the page just shows them. */
const $ = id => document.getElementById(id);
let P = null;
try {
  const b64 = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "=".repeat((4 - b64.length % 4) % 4));
  P = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
} catch (_) {}
if (!P || !P.n || !P.e) {
  document.body.classList.add("bad");
} else {
  $("p-name").textContent = P.n;
  $("p-night").textContent = P.e;
  $("p-date").textContent = P.w || "";
  $("p-venue").textContent = P.v || "—";
  $("p-city").textContent = P.c || "—";
  document.title = "You're on the list — " + P.e;
}

/* Save pass: the card as an image (share sheet on iPhone -> Save Image; download elsewhere) */
$("save").onclick = async () => {
  const btn = $("save"); btn.disabled = true;
  try {
    await document.fonts.ready;
    const canvas = await html2canvas($("shot"), { backgroundColor: "#0b0b0b", scale: 3, useCORS: true });
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], "NOTJUST-pass.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "NOTJUST guest list pass" }).catch(() => {});
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
  } catch (_) {
    alert("Couldn't save it. Take a screenshot instead.");
  }
  btn.disabled = false;
};

/* Add to calendar: an all-day event on the night (or nights) */
$("cal").onclick = () => {
  if (!P || !/^\d{4}-\d{2}-\d{2}$/.test(P.d || "")) return alert("No date for this night.");
  const day = s => s.replace(/-/g, "");
  const next = s => { const t = new Date(s + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10).replace(/-/g, ""); };
  const esc = s => String(s || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//NOTJUST//Guest list//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:" + day(P.d) + "-" + Math.random().toString(36).slice(2) + "@notjust.music",
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    "DTSTART;VALUE=DATE:" + day(P.d),
    "DTEND;VALUE=DATE:" + next(P.end || P.d),
    "SUMMARY:" + esc(P.e + " · NOTJUST guest list"),
    "LOCATION:" + esc([P.v, P.c].filter(Boolean).join(", ")),
    "DESCRIPTION:" + esc("You're on the NOTJUST guest list. Give your name at the door and bring your ID. See you inside."),
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = "NOTJUST-" + day(P.d) + ".ics"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
</script>
</body>
</html>
