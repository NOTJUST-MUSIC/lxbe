<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NOTJUST List</title>
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOTJUST List">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0b; --ink:#f3ede2; --soft:#c9c3b8; --muted:#8f8a82; --line:#2a2826;
    --field:#141312; --card:#121110; --red:#d62a1e; --ok:#f3ede2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink)}
  body{font:15px/1.45 "Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100svh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}

  header{position:sticky;top:0;z-index:5;background:rgba(11,11,11,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand img{width:92px;height:auto;display:block}
  .kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .kicker .star{color:var(--red);margin-left:6px}
  .refresh{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;font-size:18px;display:grid;place-items:center;flex:none}
  .refresh.spin span{display:inline-block;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .updated{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.04em}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
  .tab{border:1px solid var(--line);border-radius:12px;padding:8px 2px 7px;text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .tab b{display:block;font-family:"Instrument Serif",serif;font-weight:400;font-size:26px;line-height:1;letter-spacing:0;color:var(--ink);margin-bottom:2px}
  .tab.on{border-color:var(--ink);color:var(--ink)}
  .tab[data-f="Pending"].on{border-color:var(--red)}
  .tab[data-f="Pending"] b{color:var(--red)}

  .flabel{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 2px 6px}
  .export{display:none;align-items:center;gap:8px;margin:-2px 0 10px}
  .export.on{display:flex}
  .export span{font-size:12px;color:var(--muted)}
  .nights{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
  .nights::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--soft);white-space:nowrap}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#0b0b0b}
  .chip i{font-style:normal;opacity:.6;margin-left:4px}

  #q{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px;outline:none}
  #q::placeholder{color:var(--muted)}
  #q:focus{border-color:var(--muted)}

  main{padding:14px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .row{display:flex;gap:12px;align-items:flex-start}
  .av{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;
    font-family:"Instrument Serif",serif;font-size:21px;color:var(--ink);background:#181715}
  .info{flex:1;min-width:0}
  .name{font-weight:600;font-size:17px;line-height:1.25}
  .ig{display:inline-block;margin-top:2px;color:var(--red);text-decoration:none;font-weight:500}
  .meta{color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
  .meta a{text-decoration:none}
  .night{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--field);font-size:13px;color:var(--soft)}
  .night b{color:var(--ink);font-weight:600}
  .pill{flex:none;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.Pending{color:var(--red);border-color:rgba(214,42,30,.45)}
  .pill.Confirmed{color:#0b0b0b;background:var(--ink);border-color:var(--ink)}
  .pill.Declined{color:var(--muted)}
  .sent{margin-top:8px;font-size:12px;color:var(--muted)}
  .sent::before{content:"\2726  ";color:var(--red)}
  .acts{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;border-radius:999px;padding:12px 10px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .btn.yes{background:var(--ink);color:#0b0b0b}
  .btn.no{border:1px solid var(--red);color:var(--red)}
  .btn.ghost{border:1px solid var(--line);color:var(--muted);font-weight:500}
  .btn:disabled{opacity:.45}
  .empty{text-align:center;color:var(--muted);padding:48px 0;font-family:"Instrument Serif",serif;font-style:italic;font-size:22px}

  /* Confirm sheet */
  .sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet.open{opacity:1;pointer-events:auto}
  .sheet-box{width:100%;max-width:520px;background:#141312;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
    padding:22px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(20px);transition:transform .2s}
  .sheet.open .sheet-box{transform:none}
  .sheet h2{font-family:"Instrument Serif",serif;font-weight:400;font-size:34px;line-height:1.05}
  .sheet h2 em{color:var(--red)}
  .sheet p{color:var(--soft);margin:10px 0 18px;font-size:14px;overflow-wrap:anywhere}
  .sheet .acts{margin-top:0}

  .top-btns{display:flex;gap:8px;flex:none}
  #bell{color:var(--muted)}
  #bell.on{color:var(--red);border-color:rgba(214,42,30,.5)}
  #bell.on svg{fill:currentColor}

  /* Invitados / Noches switch */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px;padding:4px;border:1px solid var(--line);border-radius:999px}
  .seg button{border-radius:999px;padding:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#0b0b0b}
  body[data-view="nights"] .guest-only{display:none !important}
  body:not([data-view="nights"]) .nights-only{display:none !important}

  /* Noches */
  .nhead{margin-top:12px}
  .nhead .btn{width:100%;flex:none}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
  .sec{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:14px 2px 0}
  .ncard .date{width:52px;flex:none;text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 0 5px}
  .ncard .date b{display:block;font-family:"Instrument Serif",serif;font-weight:400;font-size:28px;line-height:1}
  .ncard .date span{font-size:10px;letter-spacing:.16em;color:var(--muted)}
  .ncard.past{opacity:.5}
  .ncard.live{border-color:rgba(214,42,30,.6)}
  .live-tag{display:inline-block;margin-top:8px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
  .ncard .acts{align-items:center}
  .btn.small{flex:none;padding:10px 16px;font-size:11px}
  .switch{flex:1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft);cursor:pointer;user-select:none;-webkit-user-select:none}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .switch span{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:#2a2826;transition:background .2s}
  .switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
  .switch input:checked + span{background:var(--red)}
  .switch input:checked + span::after{transform:translateX(18px);background:#fff}

  /* Night editor */
  .nform label.f{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .nform label.f input{display:block;width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 13px;font:inherit;font-size:16px;letter-spacing:0;text-transform:none;outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
  .nform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nform .switch{margin:4px 0 18px}
  .nform .del{display:block;margin:16px auto 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:underline}
  .sheet-box{max-height:92svh;overflow:auto}

  /* Lock screen: shown until this phone has your key */
  .lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
  .locked .lock{display:flex}
  .lock img{width:150px;height:auto;margin-bottom:28px}
  .lock h2{font-family:"Instrument Serif",serif;font-weight:400;font-size:44px;line-height:1}
  .lock h2 em{color:var(--red)}
  .lock p{color:var(--muted);margin:14px 0 22px;font-size:14px}
  .lock input{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;outline:none;margin-bottom:10px}
  .lock .btn{width:100%;flex:none}
  .lock .err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}
  #toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--ink);color:#0b0b0b;
    padding:11px 16px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <img src="../assets/email/notjust-logo-white.png" alt="NOTJUST">
      <span class="kicker">The list<span class="star">&#x2726;</span></span>
    </div>
    <div class="top-btns">
      <button class="refresh" id="bell" aria-label="Notificaciones"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button class="refresh" id="refresh" aria-label="Actualizar"><span>&#x21bb;</span></button>
    </div>
  </div>
  <div class="seg"><button data-view="guests" class="on">Invitados</button><button data-view="nights">Noches</button></div>
  <div class="guest-only">
  <div class="tabs">
    <button class="tab" data-f="Pending"><b id="n-Pending">0</b>Pendientes</button>
    <button class="tab" data-f="Confirmed"><b id="n-Confirmed">0</b>Dentro</button>
    <button class="tab" data-f="Declined"><b id="n-Declined">0</b>Fuera</button>
    <button class="tab" data-f="All"><b id="n-All">0</b>Todos</button>
  </div>
  <div class="flabel" id="nights-label">Fiesta</div>
  <div class="nights" id="nights"></div>
  <div class="export" id="export">
    <button class="btn small yes" id="ex-pdf" type="button">Lista PDF</button>
    <button class="btn small ghost" id="ex-copy" type="button">Copiar lista</button>
    <span id="ex-count"></span>
  </div>
  <input id="q" type="search" placeholder="Buscar nombre, @instagram o email" autocomplete="off">
  <div class="updated" id="updated">Cargando&#x2026;</div>
  </div>
  <div class="nights-only nhead">
    <p class="hint">Tus shows de la web. Activa la guest list en los que quieras: salen en el formulario y con bot&#xf3;n en la web. Al d&#xed;a siguiente de cada show se desactiva sola.</p>
  </div>
</header>

<main id="list" class="guest-only"><div class="empty">Cargando&#x2026;</div></main>
<main id="nightsView" class="nights-only"><div class="empty">Cargando&#x2026;</div></main>


<div class="sheet" id="sheet">
  <div class="sheet-box">
    <h2 id="sheet-title"></h2>
    <p id="sheet-text"></p>
    <div class="acts">
      <button class="btn ghost" id="sheet-cancel">Cancelar</button>
      <button class="btn yes" id="sheet-ok">Enviar</button>
    </div>
  </div>
</div>
<div class="lock">
  <img src="../assets/email/notjust-logo-white.png" alt="NOTJUST">
  <h2>Private <em>list.</em></h2>
  <p>This app is only for NOTJUST. Enter your key to open it.</p>
  <form id="lock-form"><input id="lock-key" type="password" autocomplete="current-password" placeholder="Key"><button class="btn yes" type="submit">Open</button></form>
  <div class="err" id="lock-err"></div>
</div>
<div id="toast"></div>

<script>
const LABEL = { Pending: "Pendiente", Confirmed: "Dentro", Declined: "Fuera" };
let guests = [], filter = "Pending", night = "", busy = false, quota = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Same night written "x" or "\u00d7" (older sign-ups) counts as one
const nightOf = g => (g.event || "").split(" \u00b7 ")[0].replace(/\s\u00d7\s/g, " x ") || "Sin noche";

/* Talks to your Google Apps Script (same URL as the form on notjust.music/list). */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzezos-3isBv-jjVhDLWC-BQgry-fOSSzVqJ54uS6CjPT5HDeGW6JwTzRxVne_Tty9C/exec";
const KEY_STORE = "notjust-app-key";
/* The service worker (notifications) can't read localStorage, so the key is mirrored in IndexedDB. */
function idbSet(k, v) {
  return new Promise(resolve => {
    try {
      const open = indexedDB.open("notjust-app", 1);
      open.onupgradeneeded = () => open.result.createObjectStore("kv");
      open.onerror = () => resolve();
      open.onsuccess = () => { const tx = open.result.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = tx.onerror = () => resolve(); };
    } catch (_) { resolve(); }
  });
}
const store = { get() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (_) { return ""; } },
  set(v) { try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch (_) {} idbSet("key", v || ""); } };
/* First time: open notjust.music/app/#k=YOURKEY in Safari and add it to the home screen.
   In Safari the key stays in the link so the home-screen icon carries it (iPhone keeps
   home-screen apps' storage separate from Safari); inside the installed app it is saved and hidden. */
(function takeKeyFromLink() {
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (!m) return;
  store.set(m[1]);
  const installed = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (installed) history.replaceState(null, "", location.pathname);
})();
const methods = { getGuests: "list", setStatus: "set" };

function api(action, params) {
  const key = store.get();
  if (!key) { lock(); return Promise.reject(new Error("Locked")); }
  const body = new URLSearchParams(Object.assign({ action: action, key: key }, params || {}));
  return fetch(ENDPOINT, { method: "POST", body: body })
    .catch(() => { throw new Error("Sin conexi\u00f3n. Prueba otra vez."); })
    .then(r => r.json())
    .then(r => {
      if (r.error === "Wrong key.") { store.set(""); lock("That key is not right."); throw new Error("Locked"); }
      if (r.error) throw new Error(r.error);
      return r;
    });
}

function call(fn, args, ok, fail) {
  api(methods[fn], fn === "setStatus" ? { row: args[0], status: args[1], email: args[2] } : {}).then(ok, fail);
}

function lock(msg) {
  document.body.classList.add("locked");
  $("#lock-err").textContent = msg || "";
}
$("#lock-form").onsubmit = e => {
  e.preventDefault();
  const v = $("#lock-key").value.trim();
  if (!v) return;
  store.set(v); $("#lock-key").value = "";
  document.body.classList.remove("locked");
  load();
};

function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 3000);
}

/* Changes made in the app bump this; a list that was requested before a change is out of date. */
let changes = 0, inFlight = 0;
function load(quiet) {
  if (!quiet) $("#refresh").classList.add("spin");
  const asked = changes;
  call("getGuests", [], r => {
    if (asked !== changes || inFlight) {           // you changed something meanwhile: ask again
      if (!inFlight) setTimeout(() => load(true), 300);
      return;
    }
    guests = r.guests; quota = r.quota;
    setBadge(guests.filter(g => g.status === "Pending").length);
    $("#refresh").classList.remove("spin");
    $("#updated").textContent = (r.who ? r.who + " \u00b7 " : "") + "Actualizado " + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) +
      " \u00b7 te quedan " + quota + " correos hoy";
    render();
  }, e => {
    $("#refresh").classList.remove("spin");
    if (e.message === "Locked") return;
    if (!quiet) { $("#list").innerHTML = '<div class="empty">No se pudo cargar.</div>'; toast(e.message); }
  });
}

/* Redraw the list without losing your place: the page stays where you were scrolled to */
function render() {
  const y = window.scrollY;
  drawList();
  if (y) { window.scrollTo(0, y); requestAnimationFrame(() => window.scrollTo(0, y)); }
}
function drawList() {
  const inNight = guests.filter(g => !night || nightOf(g) === night);
  const n = { Pending: 0, Confirmed: 0, Declined: 0 };
  inNight.forEach(g => n[g.status]++);
  Object.keys(n).forEach(k => $("#n-" + k).textContent = n[k]);
  $("#n-All").textContent = inNight.length;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.f === filter));

  // Night chips: every night that has people, in the order they first signed up
  const nights = [...new Set(guests.slice().reverse().map(nightOf))];
  if (night && nights.indexOf(night) < 0) night = "";
  $("#nights").style.display = $("#nights-label").style.display = nights.length ? "" : "none";
  $("#nights").innerHTML = [["", "Todas", guests.length]].concat(nights.map(x => [x, x, guests.filter(g => nightOf(g) === x).length]))
    .map(([v, t, c]) => `<button class="chip${v === night ? " on" : ""}" data-n="${esc(v)}">${esc(t)}<i>${c}</i></button>`).join("");

  const inList = night ? partyGuests().length : 0;
  $("#export").classList.toggle("on", !!night);
  $("#ex-count").textContent = night ? inList + " confirmado" + (inList === 1 ? "" : "s") : "";

  const q = $("#q").value.trim().toLowerCase().replace(/^@/, "");
  const list = inNight.filter(g => (filter === "All" || g.status === filter) &&
    (!q || (g.name + " " + g.instagram + " " + g.email).toLowerCase().includes(q)));
  $("#list").innerHTML = (list.length ? list.map(card).join("")
    : `<div class="empty">${filter === "Pending" && !q ? "Nadie esperando. \u2726" : "No hay nadie aqu\u00ed."}</div>`);
}

function card(g) {
  const ini = (g.name || g.email || "?").trim().split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();
  const ig = g.instagram
    ? `<a class="ig" href="https://instagram.com/${encodeURIComponent(g.instagram)}" target="_blank" rel="noopener">@${esc(g.instagram)} \u2197</a>`
    : '<div class="meta">Sin Instagram</div>';
  const parts = (g.event || "").split(" \u00b7 ");
  const acts = g.status === "Pending"
    ? `<button class="btn no" data-act="Declined" data-row="${g.row}">Declinar</button><button class="btn yes" data-act="Confirmed" data-row="${g.row}">Confirmar</button>`
    : (g.canResend ? `<button class="btn ghost" data-pass="${g.row}">Reenviar pase</button>` : "") +
      `<button class="btn ghost" data-act="Pending" data-row="${g.row}">Volver a pendiente</button>`;
  return `<div class="card" id="c${g.row}">
    <div class="row">
      <div class="av">${esc(ini)}</div>
      <div class="info">
        <div class="name">${esc(g.name || "Sin nombre")}</div>${ig}
        <div class="meta"><a href="mailto:${esc(g.email)}">${esc(g.email)}</a>${g.when ? " \u00b7 " + esc(g.when) : ""}</div>
      </div>
      <span class="pill ${esc(g.status)}">${esc(LABEL[g.status])}</span>
    </div>
    ${g.event ? `<div class="night"><b>${esc(parts[0])}</b>${parts.length > 1 ? " \u00b7 " + esc(parts.slice(1).join(" \u00b7 ")) : ""}</div>` : ""}
    ${g.sent ? `<div class="sent">${esc(g.sent)}</div>` : ""}
    <div class="acts">${acts}</div>
  </div>`;
}

/* Confirm / decline: asks first, because it emails the guest straight away */
let pending = null;
function ask(row, status) {
  const g = guests.find(x => x.row === row); if (!g) return;
  if (status === "Pending") return apply(g, status);
  const yes = status === "Confirmed";
  const already = g.sent && g.sent.indexOf(status + " email") === 0;
  $("#sheet-title").innerHTML = yes ? "\u00bfDentro de <em>la lista?</em>" : "\u00bfEsta vez <em>no?</em>";
  $("#sheet-text").textContent = (g.name || g.email) + " \u00b7 " + nightOf(g) + ". " +
    (already ? "Ya le lleg\u00f3 este correo, no se le enviar\u00e1 otra vez." : "Le llegar\u00e1 el correo de " + (yes ? "confirmado" : "lista llena") + " a " + g.email + ".");
  $("#sheet-ok").textContent = yes ? "Confirmar" : "Declinar";
  $("#sheet-ok").className = "btn " + (yes ? "yes" : "no");
  pending = { g, status };
  $("#sheet").classList.add("open");
}
function closeSheet() { $("#sheet").classList.remove("open"); pending = null; }

function apply(g, status) {
  // Move the guest straight away; put them back if the change fails
  const row = g.row, before = { status: g.status, sent: g.sent };
  const live = () => guests.find(x => x.row === row) || g;
  changes++; inFlight++; busy = true;
  live().status = status;
  render();
  call("setStatus", [row, status, g.email], r => {
    inFlight--; busy = inFlight > 0; changes++;
    const x = live(); x.status = r.status; x.sent = r.sent; quota = r.quota; render();
    toast(status === "Pending" ? "Vuelto a pendiente"
      : (status === "Confirmed" ? "Dentro \u2726 " : "Declinado \u00b7 ") + (r.emailed ? "correo enviado" : "sin correo nuevo"));
    if (!inFlight) load(true);
  }, e => {
    inFlight--; busy = inFlight > 0; changes++;
    const x = live(); x.status = before.status; x.sent = before.sent; render();
    if (e.message !== "Locked") toast("No se guard\u00f3: " + e.message);
  });
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-f],[data-n]");
  if (!t) return;
  if (t.dataset.act) ask(Number(t.dataset.row), t.dataset.act);
  else if (t.dataset.f) { filter = t.dataset.f; render(); }
  else { night = t.dataset.n; render(); }
});
$("#sheet-ok").onclick = () => { const p = pending; closeSheet(); if (p) apply(p.g, p.status); };
$("#sheet-cancel").onclick = closeSheet;
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
$("#q").oninput = render;
$("#refresh").onclick = () => document.body.dataset.view === "nights" ? loadNights(true) : load();
load();
setInterval(() => { if (!busy && !pending && !document.hidden && document.body.dataset.view !== "nights") load(true); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy) load(true); });


/* ---------- NOCHES: you choose which night the guest list is for ---------- */
let nightsData = null;
document.body.dataset.view = "guests";

function setView(v) {
  document.body.dataset.view = v;
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  window.scrollTo(0, 0);
  if (v === "nights") loadNights(!!nightsData); else load(true);
}

function loadNights(quiet) {
  if (!quiet) $("#nightsView").innerHTML = '<div class="empty">Cargando\u2026</div>';
  $("#refresh").classList.add("spin");
  api("nights").then(r => { $("#refresh").classList.remove("spin"); nightsData = r; renderNights(); },
    e => { $("#refresh").classList.remove("spin"); if (e.message !== "Locked") { toast(e.message); if (!nightsData) $("#nightsView").innerHTML = '<div class="empty">No se pudo cargar.</div>'; } });
}

function renderNights() {
  const all = nightsData.nights, up = all.filter(n => !n.past), past = all.filter(n => n.past);
  let html = up.length ? up.map(nightCard).join("") : '<div class="empty">No hay shows pr\u00f3ximos en la web.</div>';
  if (!(nightsData.live || []).length && up.length) html = '<div class="hint" style="text-align:center">Ninguna guest list activada: el formulario sale cerrado.</div>' + html;
  if (past.length) html += '<div class="sec">Pasadas</div>' + past.slice(0, 6).map(nightCard).join("");
  $("#nightsView").innerHTML = html;
}

function nightCard(n) {
  const live = (nightsData.live || []).indexOf(n.id) >= 0;
  return `<div class="card ncard${n.past ? " past" : ""}${live ? " live" : ""}">
    <div class="row">
      <div class="date"><b>${esc(n.day)}</b><span>${esc(n.month)}</span></div>
      <div class="info">
        <div class="name">${esc(n.name)}</div>
        <div class="meta">${esc(n.when)}${n.venue ? " \u00b7 " + esc(n.venue) : ""}</div>
        <div class="meta">${n.signups} apuntado${n.signups === 1 ? "" : "s"}</div>
        ${live ? '<span class="live-tag">\u25cf En el formulario ahora</span>' : ""}
      </div>
    </div>
    ${n.past ? "" : `<div class="acts"><label class="switch"><input type="checkbox" data-open="${esc(n.id)}"${n.open ? " checked" : ""}><span></span>${n.open ? "Guest list activada" : "Sin guest list"}</label></div>`}
  </div>`;
}

document.addEventListener("click", e => {
  const v = e.target.closest(".seg button[data-view]");   // only the Invitados / Noches switch (the page itself also carries data-view)
  if (v) setView(v.dataset.view);
});
document.addEventListener("change", e => {
  const t = e.target.closest("[data-open]");
  if (!t) return;
  const open = t.checked;
  t.disabled = true;
  api("openNight", { id: t.dataset.open, open: open ? "true" : "false" })
    .then(r => { nightsData = r; renderNights(); toast(open ? "Guest list activada \u2726" : "Guest list desactivada"); },
      e => { t.checked = !open; t.disabled = false; if (e.message !== "Locked") toast(e.message); });
});

/* ---------- NOTIFICATIONS (iPhone home-screen app, iOS 16.4+) ---------- */
const VAPID_PUBLIC = "BACAwdzYlbhYXT25qIIOw7VqCqWw3oiyJTWCQXYh-1su_Axf3HaQ9YdRKkA4ddq80wVCQjIraRzVlNbBUyy9src";
const pushReady = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
idbSet("key", store.get());

function setBadge(n) {
  try { if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (_) {}
}
function keyBytes(b64) {
  const s = atob((b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
// fresh = true (bell tap): drop this phone's old registration and make a new one with the current key.
// Returns "renewed-other-key" if the old one had been made with a different key.
async function saveSubscription(fresh) {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription(), note = "";
  const want = keyBytes(VAPID_PUBLIC);
  const sameKey = s => { try { const k = new Uint8Array(s.options.applicationServerKey); return k.length === want.length && k.every((b, i) => b === want[i]); } catch (_) { return true; } };
  if (sub && (fresh || !sameKey(sub))) {
    if (!sameKey(sub)) note = "renewed-other-key";
    try { await sub.unsubscribe(); } catch (_) {}
    sub = null;
  }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
  await api("subscribe", { sub: JSON.stringify(sub) });
  return note;
}
function bellState() { $("#bell").classList.toggle("on", pushReady && Notification.permission === "granted"); }
bellState();
// Already on: keep this phone registered (the address can change)
if (pushReady && Notification.permission === "granted" && store.get()) saveSubscription().catch(() => {});

$("#bell").onclick = () => {
  if (!pushReady) return toast("Abre la app desde el icono de la pantalla de inicio para activar avisos.");
  if (Notification.permission === "denied") return toast("Avisos bloqueados: act\u00edvalos en Ajustes \u203a Notificaciones \u203a NOTJUST List.");
  // iPhone only asks if this happens straight from the tap
  Notification.requestPermission().then(async perm => {
    bellState();
    if (perm !== "granted") return toast("Sin permiso para avisos.");
    toast("Registrando este m\u00f3vil\u2026");
    const step = (msg, ms) => Promise.race([msg, new Promise((_, no) => setTimeout(() => no(new Error("tard\u00f3 demasiado")), ms))]);
    try {
      const reg = await step(navigator.serviceWorker.ready, 10000);
      const want = keyBytes(VAPID_PUBLIC);
      let old = await reg.pushManager.getSubscription(), oldKey = "ninguno";
      if (old) {
        try { const k = new Uint8Array(old.options.applicationServerKey); oldKey = k.length === want.length && k.every((b, i) => b === want[i]) ? "igual" : "OTRA clave"; } catch (_) { oldKey = "?"; }
        await step(old.unsubscribe(), 10000).catch(() => {});
      }
      const sub = await step(reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want }), 15000);
      await step(api("subscribe", { sub: JSON.stringify(sub) }), 20000);
      toast("Registrado \u2713 (registro anterior: " + oldKey + ")");
    } catch (e) { if (e.message !== "Locked") toast("Fallo: " + e.message); }
  });
};

/* Resend the confirmed email with the pass to one guest (lost it, didn't arrive...) */
document.addEventListener("click", e => {
  const one = e.target.closest("[data-pass]");
  if (!one) return;
  const g = guests.find(x => x.row === Number(one.dataset.pass));
  if (!g || !confirm("\u00bfReenviar el pase a " + (g.name || g.email) + "?\nLe llega otra vez el correo de confirmado con su pase a " + g.email + ".")) return;
  one.disabled = true;
  changes++; inFlight++; busy = true;
  api("sendPass", { row: g.row, email: g.email }).then(r => {
    inFlight--; busy = inFlight > 0; changes++;
    toast(r.sent ? "Pase reenviado \u2726" : "No se pudo: l\u00edmite de correos de hoy");
    load(true);
  }, err => {
    inFlight--; busy = inFlight > 0; changes++; one.disabled = false;
    if (err.message !== "Locked") toast(err.message);
  });
});

/* ---------- LIST FOR THE CLUB: confirmed guests of one party, as a PDF or as text ---------- */
function partyGuests() {
  return guests.filter(g => nightOf(g) === night && g.status === "Confirmed")
    .sort((a, b) => a.name.localeCompare(b.name, "es", { sensitivity: "base" }));
}
function partyInfo() {
  const g = guests.find(x => nightOf(x) === night), parts = (g ? g.event : "").split(" \u00b7 ");
  return { name: night, when: parts[1] || "", venue: parts.length > 2 ? parts[parts.length - 1] : "" };
}
const listName = () => "NOTJUST guest list - " + night.replace(/[^A-Za-z0-9 \-]+/g, "").trim();
const blackLogo = new Image();
blackLogo.src = "../assets/email/notjust-logo-black.png";

$("#ex-copy").onclick = () => {
  const L = partyGuests(), info = partyInfo();
  if (!L.length) return toast("No hay confirmados en esta fiesta.");
  const text = "NOTJUST guest list\n" + [info.name, info.when, info.venue].filter(Boolean).join(" \u00b7 ") + "\n" +
    L.length + " guest" + (L.length === 1 ? "" : "s") + "\n\n" +
    L.map((g, i) => (i + 1) + ". " + g.name).join("\n");
  const done = () => toast("Lista copiada \u2726 P\u00e9gala en WhatsApp o en un email");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
};
function fallbackCopy(text, done) {
  const t = document.createElement("textarea");
  t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
  try { document.execCommand("copy"); done(); } catch (_) { toast("No se pudo copiar."); }
  t.remove();
}

$("#ex-pdf").onclick = () => {
  const L = partyGuests(), info = partyInfo();
  if (!L.length) return toast("No hay confirmados en esta fiesta.");
  if (!window.jspdf) return toast("Cargando\u2026 vuelve a pulsar en un segundo.");
  // Standard PDF fonts only know Western characters: keep accents, drop anything else
  const pdfText = x => String(x || "").normalize("NFC").replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"')
    .replace(/[\u2013\u2014]/g, "-").replace(/[^\x20-\x7e\xa0-\xff]/g, "");
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 18, ROW = 8.2, TOP_FIRST = 70, TOP_NEXT = 30, BOTTOM = 280;
  const header = first => {
    if (first) {
      try { doc.addImage(blackLogo, "PNG", M, 16, 42, 42 * blackLogo.naturalHeight / blackLogo.naturalWidth, "logo", "FAST"); } catch (_) {}
      doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(214, 42, 30);
      doc.text("GUEST LIST", W - M, 22, { align: "right", charSpace: 0.8 });
      doc.setTextColor(17, 17, 17); doc.setFontSize(20);
      doc.text(pdfText(info.name), M, 44);
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(90, 90, 90);
      doc.text(pdfText([info.when, info.venue].filter(Boolean).join("  \u00b7  ")), M, 51);
      doc.setFontSize(9);
      doc.text(L.length + " guest" + (L.length === 1 ? "" : "s") + "  \u00b7  sent " + new Date().toLocaleDateString("en-GB"), M, 57);
    }
    const y = first ? TOP_FIRST - 6 : TOP_NEXT - 6;
    doc.setDrawColor(17, 17, 17); doc.setLineWidth(0.4); doc.line(M, y - 4, W - M, y - 4);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(120, 120, 120);
    doc.text("#", M, y, { charSpace: 0.5 }); doc.text("NAME", M + 12, y, { charSpace: 0.5 });
  };
  header(true);
  let y = TOP_FIRST;
  L.forEach((g, i) => {
    if (y > BOTTOM) { doc.addPage(); header(false); y = TOP_NEXT; }
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(150, 150, 150);
    doc.text(String(i + 1), M, y);
    doc.setFontSize(11.5); doc.setTextColor(17, 17, 17);
    doc.text(doc.splitTextToSize(pdfText(g.name), W - 2 * M - 12)[0], M + 12, y);
    doc.setDrawColor(225, 225, 225); doc.setLineWidth(0.2); doc.line(M, y + 3, W - M, y + 3);
    y += ROW;
  });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(150, 150, 150);
    doc.text("NOTJUST  \u00b7  team@notjust.music  \u00b7  notjust.music", M, 289);
    doc.text(i + " / " + pages, W - M, 289, { align: "right" });
  }
  const blob = doc.output("blob"), file = new File([blob], listName() + ".pdf", { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: listName() }).catch(err => { if (!err || err.name !== "AbortError") openPdf(blob); });
  } else openPdf(blob);
};
function openPdf(blob) {
  const url = URL.createObjectURL(blob);
  const w = window.open(url, "_blank");
  if (!w) { const a = document.createElement("a"); a.href = url; a.download = listName() + ".pdf"; a.click(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
