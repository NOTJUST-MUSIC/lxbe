<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Listen to NOTJUST — sets, mixes, edits and bootlegs.">
  <title>NOTJUST — Listen</title>
  <link rel="icon" href="../assets/notjust-favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="../assets/notjust-favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/notjust-apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #050505;
      --white: #f4f2ed;
      --red: #ff0000;
      --line: rgba(255, 255, 255, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--black);
      color: var(--white);
      font-family: Inter, sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url('../assets/sls-88.webp') center 35%/cover no-repeat;
      transform: scale(1.05);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(5, 5, 5, .72), rgba(5, 5, 5, .9) 55%, var(--black)),
        radial-gradient(circle at 50% 0%, rgba(255, 0, 0, .18), transparent 60%);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 56px) 20px calc(env(safe-area-inset-bottom, 0px) + 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .back {
      align-self: flex-start;
      margin-bottom: 40px;
      color: rgba(255, 255, 255, .7);
      text-decoration: none;
      font: 600 10px/1 'IBM Plex Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .back:hover { color: var(--red); }

    .page h1 {
      margin: 0;
      line-height: 0;
    }

    .page h1 img {
      width: min(260px, 70vw);
      height: auto;
    }

    .tagline {
      margin: 18px 0 0;
      font: 500 11px/1.5 'IBM Plex Mono', monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--red);
    }

    .links {
      width: 100%;
      margin: 44px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .link {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 74px;
      padding: 16px 22px;
      border: 1px solid var(--line);
      background: rgba(5, 5, 5, .55);
      backdrop-filter: blur(10px);
      color: var(--white);
      text-decoration: none;
      transition: background .25s, border-color .25s, color .25s, transform .25s;
    }

    .link:hover,
    .link:focus-visible {
      background: var(--red);
      border-color: var(--red);
      color: var(--black);
      transform: translateY(-2px);
      outline: none;
    }

    .link-index {
      font: 500 10px/1 'IBM Plex Mono', monospace;
      color: var(--red);
    }

    .link:hover .link-index,
    .link:focus-visible .link-index { color: var(--black); }

    .link strong {
      display: block;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .link small {
      display: block;
      margin-top: 6px;
      font: 500 10px/1.3 'IBM Plex Mono', monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: .65;
    }

    .link-arrow {
      font: 400 18px/1 'IBM Plex Mono', monospace;
    }

    .link.primary {
      background: var(--red);
      border-color: var(--red);
      color: var(--black);
    }

    .link.primary .link-index { color: var(--black); }

    .link.primary:hover,
    .link.primary:focus-visible {
      background: var(--white);
      border-color: var(--white);
    }



    .page footer {
      margin-top: auto;
      padding-top: 48px;
      font: 500 9px/1 'IBM Plex Mono', monospace;
      letter-spacing: .08em;
      color: rgba(255, 255, 255, .45);
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: rise .7s cubic-bezier(.2, .7, .2, 1) forwards;
    }

    @keyframes rise { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; transform: none; }
      .link { transition: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="page">
    <a class="back" href="../">← Press kit</a>

    <h1 class="reveal"><img src="../assets/NOTJUST_logo_blanco.png" alt="NOTJUST"></h1>
    <p class="tagline reveal" style="animation-delay:.1s">It was never just music</p>

    <ul class="links">
      <li class="reveal" style="animation-delay:.15s">
        <a class="link primary" href="https://soundcloud.com/notjusttt" target="_blank" rel="noopener">
          <span class="link-index">01</span><span><strong>SoundCloud</strong><small>Sets &amp; releases</small></span><span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li class="reveal" style="animation-delay:.2s">
        <a class="link" href="https://www.mixcloud.com/alexbemusic/" target="_blank" rel="noopener">
          <span class="link-index">02</span><span><strong>Mixcloud</strong><small>Full-length mixes</small></span><span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li class="reveal" style="animation-delay:.25s">
        <a class="link" href="https://www.dropbox.com/scl/fo/du0qxqgpbzqd1y9wwxsyp/AC6X1XMXLX73YhIruZKKpL4?rlkey=j8uqdsey0djk5iphj446rrk0m&amp;st=zfjhisde&amp;dl=0" target="_blank" rel="noopener">
          <span class="link-index">03</span><span><strong>Edits &amp; Bootlegs</strong><small>Download</small></span><span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li class="reveal" style="animation-delay:.3s">
        <a class="link" href="../">
          <span class="link-index">04</span><span><strong>Official Press Kit</strong><small>Bio, live history &amp; rider</small></span><span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li class="reveal" style="animation-delay:.35s">
        <a class="link" href="../#contact">
          <span class="link-index">05</span><span><strong>Bookings</strong><small>Book NOTJUST for your event</small></span><span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>


    <footer>© 2026 NOTJUST. All rights reserved.</footer>
  </div>
</body>
</html>
